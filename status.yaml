timezone: America/Toronto

# The script will never overwrite these.
protected_statuses:
  - text: Off shift
    emoji: ":zzz:"
  - text: Event
    emoji: ":circus_tent:"
  - text: In meeting
  - emoji: ":spiral_calendar_pad:"

# The script is allowed to overwrite only these statuses.
managed_statuses:
  office:
    text: ""
    emoji: ":office:"
  wfh:
    text: WFH
    emoji: ":house:"
  lunch:
    text: Lunch Break
    emoji: ":cookie:"
  off-shift:
    text: off shift
    emoji: "dizzy-squirtle"

# First matching rule wins, so lunch goes before WFH/office.
schedule:
  - status: lunch
    days: [mon, tue, wed, thu, fri]
    start: "13:00"
    end: "14:00"

  - status: office
    days: [mon, thu]
    start: "09:00"
    end: "18:00"

  - status: wfh
    days: [tue, wed, fri]
    start: "09:00"
    end: "18:00"

  - status: off-shift
    days: [mon, tue, wed, fri, sat, sun]
    start: "00:00"
    end: "23:59"
